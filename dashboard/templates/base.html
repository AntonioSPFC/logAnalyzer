<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Call Analysis Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-size: 0.9rem; }
        .conversation-customer { background-color: #e8f5e9; border-left: 4px solid #4caf50; padding: 0.4rem 0.6rem; }
        .conversation-assistant { background-color: #e3f2fd; border-left: 4px solid #2196f3; padding: 0.4rem 0.6rem; }
        .timeline-event { border-left: 2px solid #dee2e6; padding-left: 0.8rem; margin-left: 0.3rem; margin-bottom: 0.3rem; }
        .tool-call-result { background-color: #fff3e0; border-left: 4px solid #ff6f00; padding: 0.4rem 0.6rem; font-size: 0.8rem; }
        .card-header { padding: 0.4rem 0.75rem; font-size: 0.85rem; }
        .card-body { padding: 0.5rem 0.75rem; }
        .card { margin-bottom: 0.75rem !important; }
        p { margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark py-1">
        <div class="container-fluid">
            <a class="navbar-brand py-0" href="/">&#x1F4DE; Call Analysis</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="/">Buscar</a>
                <a class="nav-link" href="/reports">Relatórios</a>
            </div>
        </div>
    </nav>
    <div class="container-fluid px-3 mt-2">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
