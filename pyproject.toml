[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analisador-logs"
version = "0.1.0"
description = "Ferramenta de análise de logs multi-aplicação (VPL, ORK, VOCI)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.82.0",
]

[project.scripts]
analisador-logs = "log_analyzer.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["log_analyzer*"]
